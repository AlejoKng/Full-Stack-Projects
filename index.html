<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Mi primer HTML</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }

        main {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        section {
            margin-bottom: 20px;
        }

        h1,
        h3 {
            color: rebeccapurple;
        }

        figure {
            margin: 10px 0;
        }
    </style>
</head>

<body>
    <main>
        <section>
            <h1>Bienvenido a mi página web</h1>
            <p>Esta es una página de ejemplo creada para practicar HTML.</p>
        </section>

        <section>
            <h3>Imagenes F1</h3>
            <figure>
                <img src="images\IMG6.jpg" alt="Monoplaza REDBUL RACING Mobil edition" width="300" />
                <figcaption>Monoplaza REDBUL RACING Mobil edition</figcaption>
            </figure>
            <figure>
                <img src="images\IMG5.jpg" alt="Monoplaza" width="300" />
                <figcaption>Monoplaza MERCEDEZ</figcaption>
            </figure>

            <figure>
                <img src="images\IMG2.jpg" alt="Monoplaza REDBUL RACING " width="300" />
                <figcaption>Monoplaza REDBUL RACING</figcaption>
            </figure>

            <figure>
                <img src="images\IMG4.jpg" alt="Monoplaza REDBUL RACING Mobil edition" width="300" />
                <figcaption>Monoplaza MCLAREN</figcaption>
            </figure>

            <figure>
                <img src="images\IMG3.jpg" alt="Monoplaza REDBUL RACING Mobil edition" width="300" />
                <figcaption>Monoplaza APEX</figcaption>
            </figure>

            <figure>
                <img src="images\IMG1.jpg" alt="Monoplaza REDBUL RACING Mobil edition" width="300" />
                <figcaption>Monoplaza REDBULL RB18</figcaption>
            </figure>

            <section>
                <h3>Videos F1</h3>
                <figure>
                    <video width="600" controls>
                        <source src="VIDEO\VID1.mp4" type="video/mp4">
                    </video>
                    <figcaption>Video F1 FUTURISTIC</figcaption>
                </figure>
                <figure>
                    <video width="600" controls>
                        <source src="VIDEO\VID2.mp4" type="video/mp4">
                    </video>
                    <figcaption>Video F1 INSIDE</figcaption>
                </figure>
                <figure>
                    <video width="600" controls>
                        <source src="VIDEO\VID3.mp4" type="video/mp4">
                    </video>
                    <figcaption>Video F1 LAP</figcaption>
                </figure>
            </section>

    </main>
</body>

</html>
